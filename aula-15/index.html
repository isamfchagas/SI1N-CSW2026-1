<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>

    <style>
        body {
            display: flex;
            align-items: center;
            justify-content: center;


        }

        .calculadora {
            background-color: cornflowerblue;
            color: white;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            height: 15%;
            width: 35%;
            border: none;
            border-radius: 25px;
           


        }

        .botoes {

            display: block;
            align-content: center;
            justify-content: center;
            gap: 10px;

        }

        .dia {
            width: 60px;
        }

        .mes {
            width: auto;

        }

        .ano {
            width: 350x;
        }

        .botaoCalc {
            display: flex;
            align-items: center;
            justify-content: center;
            padding-top: 30px;
            width: 100%;
        }

        .calcular {
            width: 90%;
        }

    </style>
</head>

<body>

    <div class="calculadora">



        <div class="botoes">

            <label>Dia:</label>
            <input type="number" value="" min="1" max="31" class="dia">

            <label>Mês:</label>
            <select name="meses" id="mesNascimento" class="mes">
                <option value="">-</option>
                <option value="Janeiro">Janeiro</option>
                <option value="Fevereiro">Fevereiro</option>
                <option value="Março">Março</option>
                <option value="Abril">Abril</option>
                <option value="Maio">Maio</option>
                <option value="Junho">Junho</option>
                <option value="Julho">Julho</option>
                <option value="Agosto">Agosto</option>
                <option value="Setembro">Setembro</option>
                <option value="Outubro">Outubro</option>
                <option value="Novembro">Novembro</option>
                <option value="Dezembro">Dezembro</option>

            </select>
            <label>Ano:</label>
            <input type="number" value="" min="1900" max="2026" class="ano">

        </div>
        <div class="botaoCalc">
            <button class="calcular">Calcular</button>
        </div>


    </div>

                alert("Digite um ano válido")
                return
            }

            document.getElemetById("resultado").innerHTML = "Sua Idade é : " + idade
        }
    </script>

</body>

</html>
